{% extends "layout.html" %}

{% block body %}
<div class="auth">
    <h2>{{ 'Edit Book' if book else 'Add New Book' }}</h2>
    <form method="post" class="auth-form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ book.title if book else '' }}" required>
        
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ book.author if book else '' }}" required>
        
        <label for="category">Category</label>
        <input type="text" id="category" name="category" value="{{ book.category if book else '' }}" required>
        
        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" value="{{ book.price if book else '' }}" required>
        
        <label for="image_url">Image URL</label>
        <input type="url" id="image_url" name="image_url" value="{{ book.image_url if book else '' }}" required>
        
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4">{{ book.description if book else '' }}</textarea>
        
        <button type="submit" class="btn">{{ 'Update Book' if book else 'Create Book' }}</button>
        <a href="/admin" class="btn btn-danger" style="text-align:center; background-color: #64748b !important;">Cancel</a>
    </form>
</div>
{% endblock %}
